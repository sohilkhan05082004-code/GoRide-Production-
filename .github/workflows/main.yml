name: Build GoRide APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract GoRide ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f 
          -name          
          "*.ZIP=$(find . -maxdepth 1 -type f 
          -name "GoRide_JVM17_Fixed.zip" -print -quit)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: goride_work
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoRide-APK
          path: 'goride_work/**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
